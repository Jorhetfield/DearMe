name: Build and Release Debug APK

on:
  push:
    branches: [ main ] # Se activa con cada push a main
  workflow_dispatch: # Permite lanzarlo manualmente desde la pestaña Actions

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Permiso necesario para crear la Release y subir archivos

    env:
      GOOGLE_SERVICES_CONTENT: ${{ secrets.GOOGLE_SERVICES_JSON }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create google-services.json
        if: env.GOOGLE_SERVICES_CONTENT != ''
        run: echo "$GOOGLE_SERVICES_CONTENT" > app/google-services.json

      # Compilamos la versión DEBUG (genera app-debug.apk)
      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      # Publicamos la Release automáticamente
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          # Genera un tag automático basado en el número de build (ej: v-15)
          tag_name: v-${{ github.run_number }}
          name: Debug Build ${{ github.run_number }}
          body: |
            ### 🛠 Cambios en esta versión
            Esta es una build automática generada desde el último push.
            - **Commit:** ${{ github.sha }}
            - **Rama:** main
          draft: false
          prerelease: true # Marcada como pre-release al ser una versión debug
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}