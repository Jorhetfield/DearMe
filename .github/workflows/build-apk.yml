name: Build APK

on:
  push:
    branches: [ main, develop, release/** ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # Definimos la variable aquí para que esté disponible en los steps
    env:
      GOOGLE_SERVICES_CONTENT: ${{ secrets.GOOGLE_SERVICES_JSON }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create google-services.json from secret
        # Usamos env. en lugar de secrets. dentro del if
        if: env.GOOGLE_SERVICES_CONTENT != ''
        run: echo "$GOOGLE_SERVICES_CONTENT" > app/google-services.json

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dearme-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # ... (resto de tus steps de build)

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    env:
      GOOGLE_SERVICES_CONTENT: ${{ secrets.GOOGLE_SERVICES_JSON }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create google-services.json from secret
        # Misma lógica aquí
        if: env.GOOGLE_SERVICES_CONTENT != ''
        run: echo "$GOOGLE_SERVICES_CONTENT" > app/google-services.json

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: app/build/outputs/apk/release/app-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}